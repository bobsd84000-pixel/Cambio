<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambio — Cours USD / EUR / CHF</title>
<style>
:root{
  --bg:#0f1115;--carte:#181b22;--bord:#2a2f3a;--texte:#e8eaef;--doux:#8b93a3;
  --accent:#f5b301;--hausse:#30a46c;--baisse:#e5484d;--rayon:14px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f4f5f7;--carte:#fff;--bord:#e1e4ea;--texte:#14161b;--doux:#5d6574}
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--texte);font:15px/1.45 -apple-system,system-ui,sans-serif;padding:16px;max-width:760px;margin:auto}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:22px;letter-spacing:-.02em}h1 b{color:var(--accent)}
.maj{font-size:12px;color:var(--doux)}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button{flex:1;min-width:90px;padding:10px;border:1px solid var(--bord);background:var(--carte);color:var(--texte);border-radius:10px;font-weight:600;font-size:15px}
nav button.actif{background:var(--accent);color:#111;border-color:var(--accent)}
.vue{display:none}.vue.actif{display:block}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:var(--rayon);padding:16px;margin-bottom:12px}
.grille3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.label{font-size:12px;color:var(--doux);text-transform:uppercase;letter-spacing:.06em}
.taux{font-size:24px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.var{font-size:13px;font-weight:600}
.hausse{color:var(--hausse)}.baisse{color:var(--baisse)}
.sous{font-size:13px;color:var(--doux)}
label{display:block;font-size:13px;color:var(--doux);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--bord);border-radius:10px;background:var(--bg);color:var(--texte);font-size:16px}
.ligne{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}
.inv{padding:11px 14px;border:1px solid var(--bord);background:var(--carte);color:var(--texte);border-radius:10px;font-size:18px}
button.prim{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#111;font-weight:700;font-size:15px}
.resultat{text-align:center;padding:8px 0}
.resultat strong{display:block;font-size:34px;letter-spacing:-.03em;color:var(--accent)}
.periodes{display:flex;gap:6px;margin:10px 0}
.periodes button{flex:1;padding:8px;border:1px solid var(--bord);background:var(--bg);color:var(--texte);border-radius:8px;font-weight:600}
.periodes button.actif{background:var(--accent);color:#111;border-color:var(--accent)}
canvas{width:100%;height:200px;display:block}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--bord);text-align:center}
th{color:var(--doux);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left;font-weight:700}
.alerte{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bord)}
.alerte button{border:0;background:none;color:var(--baisse);font-size:18px;padding:4px 8px}
.declenchee{color:var(--hausse);font-weight:700}
.info{font-size:12px;color:var(--doux);margin-top:8px}
.err{color:var(--baisse);font-size:13px;margin-top:6px}
@media(max-width:420px){.taux{font-size:20px}.resultat strong{font-size:28px}}
</style>
</head>
<body>

<header>
  <h1>Cam<b>bio</b></h1>
  <span class="maj" id="maj">—</span>
</header>

<nav>
  <button class="actif" data-vue="cours">Cours</button>
  <button data-vue="conv">Convertir</button>
  <button data-vue="histo">Historique</button>
  <button data-vue="alertes">Alertes</button>
</nav>

<!-- COURS -->
<section class="vue actif" id="cours">
  <div class="grille3" id="cartes"></div>
  <div class="carte" style="margin-top:12px">
    <div class="label">Tableau des taux</div>
    <table id="matrice"></table>
    <div class="info" id="source">Source : BCE via Frankfurter.</div>
  </div>
  <div class="err" id="err"></div>
</section>

<!-- CONVERTIR -->
<section class="vue" id="conv">
  <div class="carte">
    <label for="montant">Montant</label>
    <input id="montant" type="number" inputmode="decimal" value="100">
    <div class="ligne">
      <div><label for="de">De</label>
        <select id="de"><option>EUR</option><option>USD</option><option>CHF</option></select></div>
      <button class="inv" id="inv" aria-label="Inverser">⇄</button>
      <div><label for="vers">Vers</label>
        <select id="vers"><option>USD</option><option>EUR</option><option>CHF</option></select></div>
    </div>
  </div>
  <div class="carte resultat">
    <strong id="res">—</strong>
    <div class="sous" id="resTaux"></div>
  </div>
</section>

<!-- HISTORIQUE -->
<section class="vue" id="histo">
  <div class="carte">
    <label for="paire">Paire</label>
    <select id="paire">
      <option value="EUR/USD">EUR / USD</option>
      <option value="EUR/CHF">EUR / CHF</option>
      <option value="USD/CHF">USD / CHF</option>
      <option value="USD/EUR">USD / EUR</option>
      <option value="CHF/EUR">CHF / EUR</option>
      <option value="CHF/USD">CHF / USD</option>
    </select>
    <div class="periodes" id="periodes">
      <button data-j="7">7 j</button>
      <button data-j="30" class="actif">30 j</button>
      <button data-j="90">90 j</button>
    </div>
    <canvas id="graph"></canvas>
    <div class="info" id="stats"></div>
  </div>
</section>

<!-- ALERTES -->
<section class="vue" id="alertes">
  <div class="carte">
    <div class="label">Nouvelle alerte</div>
    <label for="aPaire">Paire</label>
    <select id="aPaire">
      <option value="EUR/USD">EUR / USD</option>
      <option value="EUR/CHF">EUR / CHF</option>
      <option value="USD/CHF">USD / CHF</option>
      <option value="USD/EUR">USD / EUR</option>
      <option value="CHF/EUR">CHF / EUR</option>
      <option value="CHF/USD">CHF / USD</option>
    </select>
    <label for="aSens">Condition</label>
    <select id="aSens"><option value="sup">Taux supérieur ou égal à</option><option value="inf">Taux inférieur ou égal à</option></select>
    <label for="aSeuil">Seuil</label>
    <input id="aSeuil" type="number" inputmode="decimal" step="0.0001" placeholder="ex : 1.1000">
    <button class="prim" id="aAjout">Ajouter l'alerte</button>
    <div class="err" id="aErr"></div>
  </div>
  <div class="carte">
    <div class="label">Mes alertes</div>
    <div id="aListe"><div class="sous" style="padding-top:8px">Aucune alerte.</div></div>
    <div class="info">Vérifiées à chaque ouverture de la page. Stockées sur cet appareil.</div>
  </div>
</section>

<script>
// ---------- Constantes ----------
const DEVISES = ["EUR", "USD", "CHF"];
const SYM = { EUR: "€", USD: "$", CHF: "CHF" };
const API = "https://api.frankfurter.dev/v1";

// Repli hors ligne : combien d'unités pour 1 €
const etat = { dernier: { EUR: 1, USD: 1.087, CHF: 0.94 }, serie: [], date: "hors ligne", jours: 30 };
const $ = id => document.getElementById(id);
const fmt = (n, d = 4) => n.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });

const stock = {
  lire(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  ecrire(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};

// Taux a → b à partir d'un jeu de taux base EUR
const taux = (r, a, b) => r[b] / r[a];

// ---------- Navigation ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button, .vue").forEach(e => e.classList.remove("actif"));
  b.classList.add("actif");
  $(b.dataset.vue).classList.add("actif");
  if (b.dataset.vue === "histo") dessiner();
});

// ---------- Chargement ----------
function isoJour(d){ return d.toISOString().slice(0, 10); }

const jsonOk = async url => { const r = await fetch(url); if (!r.ok) throw new Error(r.status); return r.json(); };

// Cours du jour : source principale (BCE), puis source de secours
async function chargerDernier(){
  try {
    const l = await jsonOk(`${API}/latest?from=EUR&to=USD,CHF`);
    return { r: { EUR: 1, USD: l.rates.USD, CHF: l.rates.CHF }, date: l.date, src: "BCE via Frankfurter" };
  } catch(e){
    const l = await jsonOk("https://open.er-api.com/v6/latest/EUR");
    return { r: { EUR: 1, USD: l.rates.USD, CHF: l.rates.CHF }, date: new Date(l.time_last_update_unix * 1000).toISOString().slice(0, 10), src: "ExchangeRate-API" };
  }
}

async function chargerHisto(){
  const debut = new Date(); debut.setDate(debut.getDate() - 95);
  const h = await jsonOk(`${API}/${isoJour(debut)}..?from=EUR&to=USD,CHF`);
  return Object.keys(h.rates).sort().map(d => ({ d, r: { EUR: 1, USD: h.rates[d].USD, CHF: h.rates[d].CHF } }));
}

async function charger(){
  const [d, h] = await Promise.allSettled([chargerDernier(), chargerHisto()]);
  if (d.status === "fulfilled"){
    etat.dernier = d.value.r; etat.date = d.value.date;
    $("source").textContent = "Source : " + d.value.src + ".";
    stock.ecrire("dernier", JSON.stringify(d.value));
    $("err").textContent = "";
  } else {
    // Dernier cours réel mémorisé, sinon taux indicatifs
    const m = JSON.parse(stock.lire("dernier") || "null");
    if (m){ etat.dernier = m.r; etat.date = m.date; }
    $("err").textContent = m ? "Hors connexion : derniers cours enregistrés affichés." : "Hors connexion : taux indicatifs, non à jour.";
  }
  if (h.status === "fulfilled") etat.serie = h.value;
  $("maj").textContent = etat.date === "hors ligne" ? "Hors ligne" : "Cours du " + etat.date.split("-").reverse().join("/");
  afficherCours(); convertir(); dessiner(); afficherAlertes();
}

// ---------- Cours ----------
const PAIRES = [["EUR","USD"],["EUR","CHF"],["USD","CHF"]];

function variation(a, b){
  const s = etat.serie;
  if (s.length < 2) return null;
  const prec = taux(s[s.length - 2].r, a, b);
  const act = taux(etat.dernier, a, b);
  return (act - prec) / prec * 100;
}

function afficherCours(){
  $("cartes").innerHTML = PAIRES.map(([a, b]) => {
    const v = variation(a, b);
    const cls = v == null ? "" : v >= 0 ? "hausse" : "baisse";
    const txt = v == null ? "—" : (v >= 0 ? "▲ +" : "▼ ") + fmt(v, 2) + " %";
    return `<div class="carte" style="margin:0"><div class="label">${a}/${b}</div>
      <div class="taux">${fmt(taux(etat.dernier, a, b))}</div><div class="var ${cls}">${txt}</div></div>`;
  }).join("");

  $("matrice").innerHTML = "<thead><tr><th>1 …</th>" + DEVISES.map(d => `<th>${d}</th>`).join("") + "</tr></thead><tbody>" +
    DEVISES.map(a => `<tr><td>${a}</td>` + DEVISES.map(b => `<td>${a === b ? "—" : fmt(taux(etat.dernier, a, b))}</td>`).join("") + "</tr>").join("") +
    "</tbody>";
}

// ---------- Convertisseur ----------
function convertir(){
  const m = parseFloat($("montant").value);
  const a = $("de").value, b = $("vers").value;
  if (isNaN(m)){ $("res").textContent = "—"; $("resTaux").textContent = ""; return; }
  const t = taux(etat.dernier, a, b);
  $("res").textContent = fmt(m * t, 2) + " " + SYM[b];
  $("resTaux").textContent = `1 ${a} = ${fmt(t)} ${b}`;
}
["montant", "de", "vers"].forEach(id => $(id).oninput = convertir);
$("inv").onclick = () => { const x = $("de").value; $("de").value = $("vers").value; $("vers").value = x; convertir(); };

// ---------- Historique ----------
document.querySelectorAll("#periodes button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#periodes button").forEach(e => e.classList.remove("actif"));
  b.classList.add("actif");
  etat.jours = +b.dataset.j;
  dessiner();
});
$("paire").onchange = dessiner;

function dessiner(){
  const c = $("graph"), dpr = window.devicePixelRatio || 1;
  const W = c.clientWidth, H = c.clientHeight;
  if (!W) return;
  c.width = W * dpr; c.height = H * dpr;
  const x = c.getContext("2d");
  x.scale(dpr, dpr);
  x.clearRect(0, 0, W, H);

  const [a, b] = $("paire").value.split("/");
  const lim = new Date(); lim.setDate(lim.getDate() - etat.jours);
  const pts = etat.serie.filter(p => p.d >= isoJour(lim)).map(p => ({ d: p.d, v: taux(p.r, a, b) }));
  const css = getComputedStyle(document.documentElement);

  if (pts.length < 2){
    x.fillStyle = css.getPropertyValue("--doux"); x.font = "14px system-ui";
    x.fillText("Historique indisponible (hors ligne)", 12, 100);
    $("stats").textContent = "";
    return;
  }
  const vals = pts.map(p => p.v);
  const mn = Math.min(...vals), mx = Math.max(...vals), marge = (mx - mn) * 0.1 || mx * 0.001;
  const lo = mn - marge, hi = mx + marge;
  const px = i => 8 + i * (W - 16) / (pts.length - 1);
  const py = v => H - 24 - (v - lo) / (hi - lo) * (H - 44);

  const monte = vals.at(-1) >= vals[0];
  const couleur = css.getPropertyValue(monte ? "--hausse" : "--baisse");
  x.strokeStyle = couleur; x.lineWidth = 2.5; x.lineJoin = "round"; x.beginPath();
  pts.forEach((p, i) => i ? x.lineTo(px(i), py(p.v)) : x.moveTo(px(i), py(p.v)));
  x.stroke();

  x.fillStyle = css.getPropertyValue("--doux"); x.font = "12px system-ui";
  x.fillText(fmt(mx), 8, 14);
  x.fillText(fmt(mn), 8, H - 8);
  x.textAlign = "right"; x.fillText(pts.at(-1).d, W - 8, H - 8); x.textAlign = "left";

  const evol = (vals.at(-1) - vals[0]) / vals[0] * 100;
  $("stats").textContent = `Min ${fmt(mn)} · Max ${fmt(mx)} · Évolution ${evol >= 0 ? "+" : ""}${fmt(evol, 2)} % sur ${etat.jours} jours`;
}
window.addEventListener("resize", dessiner);

// ---------- Alertes ----------
function lireAlertes(){ try { return JSON.parse(stock.lire("alertes") || "[]"); } catch(e){ return []; } }
function sauverAlertes(l){ stock.ecrire("alertes", JSON.stringify(l)); }

$("aAjout").onclick = () => {
  const seuil = parseFloat($("aSeuil").value);
  if (isNaN(seuil) || seuil <= 0){ $("aErr").textContent = "Seuil invalide."; return; }
  $("aErr").textContent = "";
  const l = lireAlertes();
  l.push({ paire: $("aPaire").value, sens: $("aSens").value, seuil });
  sauverAlertes(l);
  $("aSeuil").value = "";
  afficherAlertes(false);
};

function afficherAlertes(){
  const l = lireAlertes();
  if (!l.length){ $("aListe").innerHTML = '<div class="sous" style="padding-top:8px">Aucune alerte.</div>'; return; }
  $("aListe").innerHTML = l.map((al, i) => {
    const [a, b] = al.paire.split("/");
    const t = taux(etat.dernier, a, b);
    const ok = al.sens === "sup" ? t >= al.seuil : t <= al.seuil;
    return `<div class="alerte"><div>${al.paire} ${al.sens === "sup" ? "≥" : "≤"} ${fmt(al.seuil)}
      <div class="sous">Actuel : ${fmt(t)} ${ok ? '<span class="declenchee">· déclenchée</span>' : ""}</div></div>
      <button data-i="${i}" aria-label="Supprimer">✕</button></div>`;
  }).join("");
  document.querySelectorAll("#aListe button").forEach(b => b.onclick = () => {
    const l2 = lireAlertes(); l2.splice(+b.dataset.i, 1); sauverAlertes(l2); afficherAlertes();
  });
}

// ---------- Démarrage ----------
afficherCours(); convertir(); afficherAlertes();
charger();
</script>
</body>
</html>
